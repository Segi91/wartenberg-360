name: Kostenloser KI-Nachrichten-Test (nur Probelauf)

on:
  push:
    paths:
      - 'scripts/ai_pilot.py'
      - '.github/workflows/ai-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wartenberg-ai-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Artikelabruf installieren
        run: |
          python3 -m pip install --disable-pip-version-check 'trafilatura>=1.12,<3'
          python3 -m py_compile scripts/ai_pilot.py
      - name: Kleines Open-Source-Modell einrichten
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/w360-llama
          cmake -S /tmp/w360-llama -B /tmp/w360-llama/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build /tmp/w360-llama/build --config Release --target llama-server -j 4
          curl --fail --location --retry 3 --retry-delay 4 \
            --output /tmp/w360-qwen3-0.6b.gguf \
            'https://huggingface.co/tensorblock/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf'
          test "$(stat -c%s /tmp/w360-qwen3-0.6b.gguf)" -gt 250000000
      - name: Modell lokal starten
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/w360-llama/build/bin/llama-server \
            --model /tmp/w360-qwen3-0.6b.gguf \
            --host 127.0.0.1 --port 8089 --ctx-size 4096 --threads 3 \
            --no-webui >/tmp/w360-llama-server.log 2>&1 &
          python3 - <<'PY'
          import json,time,urllib.request
          for i in range(90):
              try:
                  d=json.load(urllib.request.urlopen("http://127.0.0.1:8089/health",timeout=2))
                  if d.get("status")=="ok":
                      print("Local open-source model is ready.")
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Model startup failed")
          PY
      - name: 20 echte Artikel als Probelauf zusammenfassen
        run: python3 -u scripts/ai_pilot.py
      - name: Bericht als privaten Prüf-Artefakt im Workflow bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wartenberg-ai-pilot-test
          path: data/ai_pilot_report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Ergebnis
        if: always()
        run: |
          if test -f data/ai_pilot_report.json; then
            python3 - <<'PY'
          import json
          r=json.load(open("data/ai_pilot_report.json",encoding="utf-8"))
          print("Quelltexte:",r["foundSourceTexts"])
          print("Formale Checks bestanden:",r["passedMechanicalChecks"])
          print("Veröffentlichung:", "NEIN, Testphase")
          PY
          else
            echo "Kein Bericht: Details in den GitHub-Actions-Logs."
            tail -30 /tmp/w360-llama-server.log 2>/dev/null || true
          fi
